# Builds on pushes to the default branch and on merge requests targeting it.
# To publish a release: Build > Pipelines > Run pipeline, set RELEASE_VERSION (e.g. v1.0.0).

stages:
  - build
  - release

variables:
  BUILD_CONFIGURATION: Release
  BUILD_OUTPUT: CatchChamberedRounds/bin/Release
  PLUGIN_NAME: Tosox.CatchChamberedRounds
  RELEASE_VERSION:
    value: ""
    description: Release version (e.g. v1.0.0). Leave empty to only build.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore
    - dotnet build --configuration "$BUILD_CONFIGURATION" --no-restore
  artifacts:
    name: SPT-CatchChamberedRounds
    paths:
      - $BUILD_OUTPUT/
    expire_in: 1 day

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION
  variables:
    ZIP_NAME: $PLUGIN_NAME-$RELEASE_VERSION.zip
    PACKAGE_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PLUGIN_NAME/$RELEASE_VERSION/$PLUGIN_NAME-$RELEASE_VERSION.zip
  script:
    - apk add --no-cache zip curl
    - mkdir -p release/BepInEx/plugins
    - cp -a "$BUILD_OUTPUT"/*.dll release/BepInEx/plugins/
    - (cd release && zip -r "../$ZIP_NAME" .)
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$ZIP_NAME" "$PACKAGE_URL"'
  release:
    tag_name: $RELEASE_VERSION
    name: $RELEASE_VERSION
    ref: $CI_COMMIT_SHA
    description: $RELEASE_VERSION
    assets:
      links:
        - name: $ZIP_NAME
          url: $PACKAGE_URL
          direct_asset_path: /$ZIP_NAME
          link_type: package
